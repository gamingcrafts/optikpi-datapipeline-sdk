[package]
name = "optikpi-datapipeline-sdk"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Official Rust SDK for the OptikPI Data Pipeline API"
license = "MIT"
repository = "https://github.com/gamingcrafts/optikpi-datapipeline-sdk"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
